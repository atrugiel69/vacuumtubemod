hl.monitor({output="",mode="preferred",position="auto",scale=1,bitdepth=10,cm="srgb",supports_wide_color=1,supports_hdr=1})
hl.config({general={gaps_in=0,gaps_out=0,border_size=0},decoration={rounding=0,shadow={enabled=false}},animations={enabled=false},misc={disable_hyprland_logo=true,disable_splash_rendering=true,disable_hyprland_guiutils_check=true},cursor={inactive_timeout=1},render={cm_auto_hdr=0}})
hl.window_rule({name="kiosk",match={class=".*"},fullscreen=true})
hl.bind("ALT + F4",hl.dsp.window.close())
hl.bind("CTRL + ALT + BackSpace",hl.dsp.exit())
local v="/storage/.kodi/addons/tools.externalhelper/bin/pa-volume-control "
hl.bind("XF86AudioRaiseVolume",hl.dsp.exec_cmd(v.."up"))
hl.bind("XF86AudioLowerVolume",hl.dsp.exec_cmd(v.."down"))
hl.bind("XF86AudioMute",hl.dsp.exec_cmd(v.."mute"))
hl.on("hyprland.start",function() local c=os.getenv("HYPRLAND_SESSION_RUNNER"); if c and c~="" then hl.exec_cmd(c) end end)
